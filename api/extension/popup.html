<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Habari</title>
  <style>
    :root { --bg:#fbfaf7; --fg:#1f2328; --muted:#5b6470; --line:#e3e0d8; --accent:#2f6f5e; --danger:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#16181b; --fg:#e8e6e1; --muted:#a3a9b1; --line:#2c3036; --accent:#6cc0a6; --danger:#f97066; } }
    body { margin:0; width: 340px; background:var(--bg); color:var(--fg); font: 15px/1.4 system-ui, sans-serif; }
    main { padding: 14px; }
    header { display:flex; justify-content:space-between; align-items:center; }
    h1 { font-size: 1.2rem; margin: 0; }
    .muted { color: var(--muted); font-size: .85rem; }
    .pick { display:block; width:100%; text-align:left; margin: 6px 0; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--accent); background: transparent; color: var(--fg); font-size: .95rem; cursor:pointer; }
    .pick[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
    textarea { width:100%; box-sizing:border-box; min-height: 60px; margin-top: 8px; padding: 8px; border-radius: 10px; border:1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
    .send { width:100%; margin-top: 10px; padding: 12px; border:0; border-radius: 12px; background: var(--accent); color: var(--bg); font-weight: 700; font-size: 1rem; cursor:pointer; }
    .exit { border:0; border-radius: 999px; padding: 6px 12px; background: var(--fg); color: var(--bg); font-weight: 600; cursor:pointer; }
    .reply { margin-top: 12px; padding: 10px; border-radius: 12px; background: var(--line); white-space: pre-wrap; }
    .danger { color: var(--danger); font-weight: 700; }
    label.shot { display:flex; gap: 6px; align-items:center; margin-top: 8px; font-size: .9rem; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <header><h1>I need a friend</h1><button class="exit" id="exit" type="button">Quick exit</button></header>
  <p class="muted">You are not in trouble. In danger now? Call <strong>116</strong>, it is free.</p>

  <form id="form">
    <div id="picks"></div>
    <textarea id="text" placeholder="What happened? Any language. You can leave this empty."></textarea>
    <label class="shot"><input type="checkbox" id="shot"> Include a picture of this page</label>
    <p class="muted" id="page"></p>
    <button class="send" id="send" type="submit" disabled>Send</button>
  </form>
  <div class="reply" id="reply" hidden></div>
</main>
<script src="platform.js"></script>
<script src="popup.js"></script>
</body>
</html>
