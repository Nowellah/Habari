<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#006463">
  <title>{% block title %}Habari{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  {% block head %}{% endblock %}
  <style>
    /* ── Design tokens (aligned with chat UI web/src/styles.css) ── */
    :root {
      --bg:       #FFF9F0;
      --bg2:      #ffffff;
      --fg:       #1a1a2e;
      --muted:    #4a5568;
      --muted2:   #6b7686;
      --line:     #e2e8f0;
      --accent:   #006463;
      --accent-l: #e8f4f4;
      --accent-d: #003F40;
      --warm:     #fdf6ec;
      --gold:     #FFC619;
      --s4: #c0251a; --s4-l: #fee2e2;
      --s3: #c2410c; --s3-l: #ffedd5;
      --s2: #92600a; --s2-l: #fef3c7;
      --s1: #4b5563; --s1-l: #f3f4f6;
      --radius: 14px;
      --shadow: 0 2px 12px rgba(0,100,99,.10);
      --shadow-lg: 0 6px 24px rgba(0,100,99,.18);
      --font: Nunito, "Segoe UI", system-ui, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #13151a; --bg2: #1c1f26;
        --fg: #e8e6e1; --muted: #9ca3af; --muted2: #6b7686; --line: #282d35;
        --accent: #3aaa80; --accent-l: #0d2e22; --accent-d: #50c998;
        --warm: #1e1c18;
        --s4: #f87171; --s4-l: #2d1515;
        --s3: #fb923c; --s3-l: #2d1a0d;
        --s2: #facc15; --s2-l: #2a230a;
        --s1: #9ca3af; --s1-l: #1f2128;
      }
    }
    /* ── Reset & base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -.01em; margin-bottom: 16px; }
    h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 10px; }
    p { margin-bottom: 8px; }
    /* ── Utilities ──────────────────────────────────────────────── */
    .muted { color: var(--muted); font-size: .9rem; }
    .small { font-size: .82rem; color: var(--muted2); }
    /* ── Quick exit ─────────────────────────────────────────────── */
    .exit {
      position: fixed; top: 12px; right: 12px; z-index: 999;
      background: #c0392b; color: #fff;
      padding: 7px 16px; border-radius: 6px;
      font-size: .85rem; font-weight: 700;
      border: none; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    /* ── Card ───────────────────────────────────────────────────── */
    .card {
      background: var(--bg2); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow);
    }
    .card + .card { margin-top: 14px; }
    /* ── Tables ─────────────────────────────────────────────────── */
    .wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th { text-align: left; padding: 8px 12px; color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; border-bottom: 2px solid var(--line); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--warm); }
    /* ── Severity badges ────────────────────────────────────────── */
    .sev { display: inline-block; font-weight: 700; font-size: .82rem; padding: 2px 8px; border-radius: 999px; }
    .sev-4 { color: var(--s4); background: var(--s4-l); }
    .sev-3 { color: var(--s3); background: var(--s3-l); }
    .sev-2 { color: var(--s2); background: var(--s2-l); }
    .sev-1 { color: var(--s1); background: var(--s1-l); }
    /* ── SLA clock badges ───────────────────────────────────────── */
    .clock { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .8rem; white-space: nowrap; font-weight: 600; }
    .clock-green  { background: #dcfce7; color: #14532d; }
    .clock-amber  { background: #fef3c7; color: #78350f; }
    .clock-red    { background: #fee2e2; color: #7f1d1d; }
    .clock-done   { color: var(--muted); }
    /* ── Two-column grid ────────────────────────────────────────── */
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 14px; }
    /* ── Definition list ────────────────────────────────────────── */
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; }
    dt { color: var(--muted); font-size: .85rem; }
    dd { font-size: .9rem; }
    /* ── Forms ──────────────────────────────────────────────────── */
    .card form { display: flex; flex-wrap: wrap; gap: 6px; align-items: end; margin: 8px 0; }
    select, input[type=text], input[type=password], textarea {
      font: inherit; padding: 7px 11px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--fg);
    }
    select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button, .btn {
      font: inherit; padding: 7px 16px;
      border-radius: 8px; border: none;
      background: var(--accent); color: #fff;
      font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    button:hover, .btn:hover { background: var(--accent-d); }
    button.secondary { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }
    button.secondary:hover { background: var(--accent-l); }
    button.danger { background: var(--s4); }
    /* ── Nav top bar (officer) ──────────────────────────────────── */
    .topbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 10px 16px; background: var(--bg2);
      border-bottom: 1px solid var(--line);
      font-size: .88rem;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar .brand { font-weight: 800; color: var(--accent); font-size: 1.1rem; letter-spacing: -.02em; display: flex; align-items: center; gap: 6px; }
    .topbar a { color: var(--muted); }
    .topbar a:hover { color: var(--accent); text-decoration: none; }
    .topbar .spacer { flex: 1; }
  </style>
</head>
<body>
  {% block exit %}{% endblock %}
  {% block topbar %}{% endblock %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
