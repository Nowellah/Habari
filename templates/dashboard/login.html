{% extends "base.html" %}
{% block title %}Officer login{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h1>Officer login</h1>
  {% if form.errors %}
    <p style="color:var(--s4)">Your username and password did not match. Please try again.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label>Username<br><input name="username" autocomplete="username" required autofocus style="width:100%;padding:8px"></label></p>
    <p><label>Password<br><input name="password" type="password" autocomplete="current-password" required style="width:100%;padding:8px"></label></p>
    <input type="hidden" name="next" value="{{ next }}">
    <p><button type="submit" style="padding:8px 16px">Log in</button></p>
  </form>
</div>
{% endblock %}
