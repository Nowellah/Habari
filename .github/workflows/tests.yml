name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Django and AI service tests
        run: python manage.py test --noinput
      - name: AI rule engine tests
        working-directory: api/ai_service/engine
        run: python -m pytest -q
      - name: Evaluation runs from a clean checkout
        run: python eval/scripts/run_all.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser extension tests
        run: node --test extension/platform.test.js
