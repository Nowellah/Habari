name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Django and AI service tests
        run: python manage.py test --noinput
      - name: Evaluation runs from a clean checkout
        run: python eval/scripts/run_all.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser extension tests
        run: node --test extension/platform.test.js
